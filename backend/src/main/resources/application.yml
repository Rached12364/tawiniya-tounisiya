server:
  port: 8080
spring:
  application:
    name: tawiniya-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tawiniya_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# Exposition Actuator (sante de l'application)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
# Config JWT (utilisee a partir de TASK-B002) + CORS (React sur localhost:3000)
app:
  jwt:
    secret: ${JWT_SECRET:changeMeInProdWithAStrongSecretKeyOf48CharsMinimum}
    expiration-ms: 86400000 # 24h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.6-flash